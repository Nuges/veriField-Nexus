# =============================================================================
# VeriField Nexus — Authoritative Registry Document Requirements Matrix
# =============================================================================
# Classifies all registry submission documents, authority forms, supporting
# evidence dossiers, and Nexus-generated submission drafts across:
# 1. Federal Republic of Nigeria — National Council on Climate Change (NCCC) / NCMAP
# 2. UNFCCC Article 6.2 Cooperative Approaches (Decision 2/CMA.3)
# 3. UNFCCC Article 6.4 Mechanism Supervisory Body (Decision 3/CMA.3)
# 4. Verra Verified Carbon Standard (VCS Standard v4.5 / v5.0)
# 5. Gold Standard for the Global Goals (GS4GG v2.2)
# 6. VeriField Nexus Cryptographic MRV & Lineage Records
# =============================================================================

version: "2026.1.0"
last_updated: "2026-08-31"

document_classes:
  - id: OFFICIAL_AUTHORITY_FORM
    description: "Official statutory or proprietary form issued/prescribed by the regulatory authority or registry body."
  - id: OFFICIAL_AUTHORITY_RECORD
    description: "Official authorization, letter of approval, gazette notice, or certificate executed by the sovereign DNA or registry."
  - id: REQUIRED_SUBMISSION_DOCUMENT
    description: "Mandatory technical report or design document required to be prepared and submitted for validation/verification."
  - id: REQUIRED_SUPPORTING_DOCUMENT
    description: "Supporting empirical evidence, baseline calculations, stakeholder logs, or calibration records."
  - id: NEXUS_GENERATED_SUBMISSION_DRAFT
    description: "Structured technical submission draft generated deterministically by VeriField Nexus from verified telemetry and metadata."
  - id: NEXUS_INTERNAL_RECORD
    description: "Cryptographic audit trail, data lineage graph, or tamper-evident seal generated for internal verification."

authorities:
  # ---------------------------------------------------------------------------
  # 1. NIGERIA — NATIONAL COUNCIL ON CLIMATE CHANGE (NCCC) / NCMAP
  # ---------------------------------------------------------------------------
  - id: NCCC_NIGERIA
    name: "National Council on Climate Change (NCCC)"
    jurisdiction: "Federal Republic of Nigeria"
    enabling_framework: "Climate Change Act 2021 / National Carbon Market Framework (NCMAP)"
    authority_type: "Designated National Authority (DNA)"
    documents:
      - document_id: NCCC_NOC_APPLICATION
        official_name: "Application for No-Objection Certificate (NOC) for Carbon Mitigation Activity"
        nexus_name: "NCCC No-Objection Certificate (NOC) Application Dossier"
        document_class: "NEXUS_GENERATED_SUBMISSION_DRAFT"
        companion_official_form: "NCCC Form NOC-01 (Prescribed by NCCC Secretariat)"
        lifecycle_stage: "HOST_COUNTRY_PRE_REGISTRATION"
        mandatory: true
        conditional: false
        official_template_available: false
        official_template_source: "UNVERIFIED — Official NCCC digital upload portal under rollout"
        nexus_generation_supported: true
        supported_formats: ["PDF", "DOCX", "JSON"]
        required_inputs: ["project_name", "developer_org", "location_state", "sector", "methodology", "estimated_annual_tco2e"]
        required_evidence: ["developer_incorporation_proof", "land_tenure_or_site_consent"]
        approval_authority: "National Council on Climate Change Secretariat"
        authorization_required: true
        blocking_conditions:
          - "HOST_COUNTRY_NOT_NIGERIA"
          - "PROJECT_DEVELOPER_UNLINKED"
          - "METHODOLOGY_UNLINKED"
        disclaimer: "This document is a VeriField Nexus Structured Compliance Draft prepared for submission to the National Council on Climate Change. It does NOT constitute an official No-Objection Certificate until formally gazetted/approved by the NCCC."

      - document_id: NCCC_PROJECT_REGISTRATION
        official_name: "Nigeria National Carbon Registry Project Registration Form"
        nexus_name: "NCCC Project Registration Dossier"
        document_class: "NEXUS_GENERATED_SUBMISSION_DRAFT"
        lifecycle_stage: "PROJECT_REGISTRATION"
        mandatory: true
        conditional: false
        official_template_available: false
        nexus_generation_supported: true
        supported_formats: ["PDF", "DOCX", "JSON"]
        required_inputs: ["project_title", "sectoral_scope", "crediting_period", "baseline_summary"]
        required_evidence: ["noc_reference_or_application", "baseline_study_report"]
        approval_authority: "NCCC Carbon Registry Administrator"
        authorization_required: true
        blocking_conditions:
          - "ZERO_ASSETS_ENROLLED"
          - "METHODOLOGY_UNLINKED"

      - document_id: NCCC_BENEFIT_SHARING
        official_name: "National Benefit Sharing & Community Development Agreement"
        nexus_name: "NCCC Sustainable Development & Benefit Sharing Report"
        document_class: "NEXUS_GENERATED_SUBMISSION_DRAFT"
        lifecycle_stage: "VALIDATION"
        mandatory: true
        conditional: false
        official_template_available: false
        nexus_generation_supported: true
        supported_formats: ["PDF", "DOCX", "JSON"]
        required_inputs: ["community_benefit_pct", "employment_metrics", "gender_action_plan"]
        required_evidence: ["stakeholder_minutes", "lsc_attendance_records"]
        approval_authority: "NCCC / Local Community Trust Committee"
        authorization_required: false
        blocking_conditions:
          - "STAKEHOLDER_CONSULTATION_MISSING"

  # ---------------------------------------------------------------------------
  # 2. UNFCCC ARTICLE 6.2 COOPERATIVE APPROACHES (DECISION 2/CMA.3)
  # ---------------------------------------------------------------------------
  - id: UNFCCC_ARTICLE_6_2
    name: "UNFCCC Article 6.2 Mechanism"
    jurisdiction: "International / Bilateral Parties"
    enabling_framework: "Decision 2/CMA.3 (Glasgow Rulebook for Article 6.2)"
    authority_type: "Host Party DNA & Acquiring Party DNA"
    documents:
      - document_id: A62_INITIAL_REPORT
        official_name: "Article 6.2 Initial Report on Cooperative Approach (Decision 2/CMA.3 Annex IV)"
        nexus_name: "Article 6.2 Initial Report & Cooperative Approach Specification"
        document_class: "NEXUS_GENERATED_SUBMISSION_DRAFT"
        lifecycle_stage: "PRE_TRANSFER_AUTHORIZATION"
        mandatory: true
        conditional: false
        official_template_available: true
        official_template_source: "UNFCCC Article 6.2 Initial Report Outline (Decision 6/CMA.4)"
        official_template_version: "CMA.4 Annex I Outline"
        nexus_generation_supported: true
        supported_formats: ["PDF", "DOCX", "JSON"]
        required_inputs: ["cooperative_approach_title", "participating_parties", "ndc_crediting_period", "metrics_tco2e", "corresponding_adjustment_method"]
        required_evidence: ["bilateral_mou_or_agreement", "host_country_letter_of_authorization"]
        approval_authority: "Host Party DNA (e.g., NCCC) & UNFCCC Secretariat"
        authorization_required: true
        blocking_conditions:
          - "HOST_COUNTRY_AUTHORIZATION_MISSING"
          - "COOPERATIVE_APPROACH_UNSPECIFIED"
          - "ZERO_ACTIVITY_DATA"

      - document_id: A62_HOST_PARTY_AUTHORIZATION_RECORD
        official_name: "Host Party Article 6.2 Authorization Instrument & Attestation"
        nexus_name: "Host Party Authorization Attestation Record"
        document_class: "OFFICIAL_AUTHORITY_RECORD"
        lifecycle_stage: "AUTHORIZATION"
        mandatory: true
        conditional: false
        official_template_available: true
        official_template_source: "Host Country Statutory Format"
        nexus_generation_supported: false
        supported_formats: ["PDF", "JSON"]
        required_inputs: ["authorization_reference", "issuing_dna", "authorized_entities", "use_scope_ndc_or_oimp"]
        required_evidence: ["official_signed_gazetted_letter_pdf"]
        approval_authority: "Host Country DNA Designated Official"
        authorization_required: true
        blocking_conditions:
          - "AUTHORIZATION_DOCUMENT_UNUPLOADED"

      - document_id: A62_STRUCTURED_SUMMARY
        official_name: "Article 6.2 Annual Structured Summary Table (Decision 2/CMA.3 Annex Table 1-5)"
        nexus_name: "Article 6.2 Annual Structured Summary / BTR Accounting Matrix"
        document_class: "NEXUS_GENERATED_SUBMISSION_DRAFT"
        lifecycle_stage: "ANNUAL_REPORTING"
        mandatory: true
        conditional: false
        official_template_available: true
        official_template_source: "UNFCCC Structured Summary Reporting Tables"
        official_template_version: "Decision 6/CMA.4 Annex II"
        nexus_generation_supported: true
        supported_formats: ["PDF", "JSON", "CSV"]
        required_inputs: ["vintage_year", "itmo_volume_generated", "first_transfer_serial_range", "ca_applied_status"]
        required_evidence: ["verified_activity_telemetry", "vvb_verification_statement"]
        approval_authority: "UNFCCC Article 6.2 Technical Expert Review Team"
        authorization_required: true
        blocking_conditions:
          - "ZERO_ACTIVITY_DATA"
          - "HOST_COUNTRY_AUTHORIZATION_MISSING"

