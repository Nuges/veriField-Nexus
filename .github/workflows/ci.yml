name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    outputs:
      fail1: ${{ steps.pytest_run.outputs.fail1 }}
      fail2: ${{ steps.pytest_run.outputs.fail2 }}
      tb1: ${{ steps.pytest_run.outputs.tb1 }}
      tb2: ${{ steps.pytest_run.outputs.tb2 }}
      summary: ${{ steps.pytest_run.outputs.summary }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify Alembic Migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          alembic heads
          alembic upgrade head

      - name: Run Backend Pytest Suite
        id: pytest_run
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///test_default.db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          python -c "import sys; print(sys.version)"
          pip list --format=columns | grep -iE "sqlalchemy|aiosqlite|pytest|pydantic|fastapi|httpx"
          set +e
          pytest tests/ -v --tb=long 2>&1 | tee pytest_output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          set -e
          echo "::group::Pytest Output (last 50 lines)"
          tail -50 pytest_output.txt
          echo "::endgroup::"
          python scripts/ci_annotate_failures.py pytest_output.txt "$GITHUB_OUTPUT"
          echo "pytest_exit=$PYTEST_EXIT" >> $GITHUB_OUTPUT

      - name: Upload Pytest Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/pytest_output.txt

      - name: Check Pytest Result
        if: always() && steps.pytest_run.outputs.pytest_exit != ''
        run: |
          echo "Pytest exit code: ${{ steps.pytest_run.outputs.pytest_exit }}"
          echo "Summary: ${{ steps.pytest_run.outputs.summary }}"
          echo "Fail1: ${{ steps.pytest_run.outputs.fail1 }}"
          echo "TB1: ${{ steps.pytest_run.outputs.tb1 }}"
          if [ "${{ steps.pytest_run.outputs.pytest_exit }}" != "0" ]; then
            echo "::error::Pytest failed with exit code ${{ steps.pytest_run.outputs.pytest_exit }}"
            exit 1
          fi
  frontend-build:
    name: Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm install

      - name: Typecheck Dashboard
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build Dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # CI quality gate verification
  sdk-check:
    name: SDK Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Typecheck SDK
        working-directory: sdk
        run: npx -p typescript tsc --noEmit

  report-failures:
    name: "F1: ${{ needs.backend-test.outputs.fail1 }}"
    needs: backend-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "F1=${{ needs.backend-test.outputs.fail1 }}"

  report-traceback:
    name: "TB: ${{ needs.backend-test.outputs.tb1 }}"
    needs: backend-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "TB=${{ needs.backend-test.outputs.tb1 }}"

  report-summary:
    name: "SUM: ${{ needs.backend-test.outputs.summary }}"
    needs: backend-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "SUM=${{ needs.backend-test.outputs.summary }}"

