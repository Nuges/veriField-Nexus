name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Verify Alembic Migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          alembic heads
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///test_default.db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          python -c "import sys; print(sys.version)"
          pip list --format=columns | grep -iE "sqlalchemy|aiosqlite|pytest|pydantic|fastapi|httpx"
          pytest tests/ -v --tb=short > pytest_output.txt 2>&1
          PYTEST_EXIT=$?
          cat pytest_output.txt
          if [ $PYTEST_EXIT -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-debug-log
            git add pytest_output.txt
            git commit -m "ci: debug log for failed run $GITHUB_RUN_ID" || true
            git push origin ci-debug-log --force || true
            exit $PYTEST_EXIT
          fi

      - name: Upload Pytest Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/pytest_output.txt
  frontend-build:
    name: Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm install

      - name: Typecheck Dashboard
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build Dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  sdk-check:
    name: SDK Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Typecheck SDK
        working-directory: sdk
        run: npx -p typescript tsc --noEmit
