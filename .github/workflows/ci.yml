name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic Migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          alembic heads
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key-32-chars-minimum"
          TESTING: "1"
        run: |
          pytest tests/ -v --tb=short

  frontend-build:
    name: Dashboard Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm install

      - name: Typecheck Dashboard
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build Dashboard
        working-directory: dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  sdk-check:
    name: SDK Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Typecheck SDK
        working-directory: sdk
        run: npx tsc --noEmit
